services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  gateway:
    build: .
    container_name: resilient-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - RATE_LIMIT=5
      - RATE_WINDOW_SEC=10
    depends_on:
      redis:
        condition: service_healthy
  